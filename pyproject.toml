[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ninaxander"
version = "0.1.0"
description = "Cross-family shared-latent language-model composition experiments"
requires-python = ">=3.10"
dependencies = [
  "torch==2.10.0",
  "transformers==5.2.0",
  "datasets==4.5.0",
  "numpy",
  "safetensors>=0.4.3",
  "huggingface_hub>=0.20",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
